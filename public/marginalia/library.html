<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library - Marginalia</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260729-161835">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="home">
    <section class="home-card">
      <div class="library-page-heading">
        <h1>Library</h1>
        <section class="library-activity-window" aria-label="Library activity">
          <div class="library-activity-window-head">
            <h2>Activity</h2>
            <p class="small">Newest below</p>
          </div>
          <div id="libraryActivityLog" class="library-activity-log" role="log" aria-live="polite" aria-relevant="additions text">
            <p class="small library-log-empty">No activity yet.</p>
          </div>
        </section>
      </div>
      <p id="appVersion" class="app-version">Version</p>
      <p class="small">Open browser-local sources or import a local library package. The app entry page remains the reader.</p>
      <div class="row">
        <a id="openReaderLink" class="primary-link" href="reader.html">Open reader</a>
        <button id="importHtmlBtn" type="button">Import source</button>
        <button id="importBundleBtn" type="button">Import bundle</button>
        <button id="importLibraryBtn" type="button">Import library</button>
        <button id="saveLibraryBtn" type="button">Save library</button>
        <div class="app-update-actions" role="group" aria-label="App updates">
          <button id="checkForUpdatesBtn" type="button">Check for updates</button>
          <button id="updateAppBtn" type="button" disabled>Update app</button>
        </div>
        <button id="clearLibraryBtn" class="danger" type="button">Clear</button>
      </div>
      <p id="appUpdateStatus" class="app-update-status small" role="status" aria-live="polite">Check for updates before updating the app.</p>
      <input id="htmlFileInput" type="file" accept=".html,.htm,text/html,.pdf,application/pdf" hidden>
      <input id="replaceSourceFileInput" type="file" accept=".html,.htm,text/html,.pdf,application/pdf" hidden>
      <input id="bundleFileInput" type="file" accept=".annotator.zip,.zip,application/zip" hidden>
      <input id="libraryFileInput" type="file" accept=".annotator-library.zip,.zip,application/zip" hidden>
      <div id="documents" class="home-documents" aria-live="polite"></div>
    </section>
  </main>

  <section id="appDialog" class="app-dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle" aria-describedby="appDialogBody" hidden>
    <div class="app-dialog">
      <h2 id="appDialogTitle"></h2>
      <p id="appDialogBody" class="small"></p>
      <div id="appDialogActions" class="app-dialog-actions"></div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
