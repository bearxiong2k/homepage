<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marginalia</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="home">
    <section class="home-card">
      <h1>Marginalia</h1>
      <p class="small">Opening the reader...</p>
      <p><a id="readerFallbackLink" class="primary-link" href="reader.html">Open reader</a></p>
    </section>
  </main>
  <script type="module">
    import { currentStorageMode, registerServiceWorker, urlWithStorage } from './runtime.js';

    const storageMode = currentStorageMode();
    const target = urlWithStorage('reader.html', {}, storageMode);
    document.querySelector('#readerFallbackLink').href = target;
    registerServiceWorker().finally(() => {
      location.replace(target);
    });
  </script>
</body>
</html>
