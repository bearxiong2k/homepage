<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marginalia</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260713-174422">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="home">
    <section class="home-card">
      <h1>Marginalia</h1>
      <p id="appVersion" class="app-version">Version</p>
      <p class="small">Opening the reader...</p>
      <p><a id="readerFallbackLink" class="primary-link" href="reader.html">Open reader</a></p>
    </section>
  </main>
  <script type="module">
    import { APP_VERSION_LABEL } from './app-version.js';
    import { currentStorageMode, urlWithStorage } from './runtime.js';

    const storageMode = currentStorageMode();
    const target = urlWithStorage('reader.html', {}, storageMode);
    document.querySelector('#appVersion').textContent = APP_VERSION_LABEL;
    document.querySelector('#readerFallbackLink').href = target;
    location.replace(target);
  </script>
</body>
</html>
